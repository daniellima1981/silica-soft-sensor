[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silica-soft-sensor"
version = "0.1.0"
description = "Soft sensor that forecasts % silica in iron ore flotation concentrate hours ahead of lab assays."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Lima", email = "55602829+daniellima1981@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
